[project]
name = "eng-study-backend"
version = "0.1.0"
description = "English study assistant backend — local LLM (llama-server) powered text analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- 웹 배포용 ---
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",       # Postgres (배포). 로컬은 SQLite 로 돌아간다
    "pyjwt>=2.10",                # 세션 쿠키 서명
    "cryptography>=44.0",         # 회원 Gemini 키 암호화 저장
    "itsdangerous>=2.2",          # OAuth state 서명
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
